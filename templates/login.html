{% extends "base.html" %}

{% block title %}Login - AI Career Counselor{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 500px;
        margin: 80px auto;
        padding: 40px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-header h2 {
        color: #0d6efd;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .auth-header p {
        color: #666;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-label {
        font-weight: 600;
        color: #333;
        margin-bottom: 10px;
        display: block;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        outline: none;
    }

    .btn-submit {
        width: 100%;
        background: linear-gradient(135deg, #0d6efd, #0dcaf0);
        color: white;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn-submit:hover {
        box-shadow: 0 6px 20px rgba(13, 110, 253, 0.4);
    }

    .auth-link {
        text-align: center;
        margin-top: 20px;
        color: #666;
    }

    .auth-link a {
        color: #0d6efd;
        font-weight: 600;
        text-decoration: none;
    }

    .auth-link a:hover {
        text-decoration: underline;
    }

    .divider {
        text-align: center;
        margin: 30px 0;
        color: #999;
        position: relative;
    }

    .divider:before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 1px;
        background: #e0e0e0;
    }

    .divider span {
        background: white;
        padding: 0 10px;
        position: relative;
    }

    @media (max-width: 768px) {
        .auth-container {
            margin: 40px 20px;
            padding: 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h2><i class="bi bi-box-arrow-in-right"></i> Login</h2>
        <p>Welcome back! Let's continue your career journey</p>
    </div>

    <form method="POST" action="/login">
        <div class="form-group">
            <label class="form-label" for="email">
                <i class="bi bi-envelope"></i> Email Address
            </label>
            <input 
                class="form-control" 
                type="email" 
                id="email" 
                name="email" 
                placeholder="your@email.com" 
                required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">
                <i class="bi bi-lock"></i> Password
            </label>
            <input 
                class="form-control" 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password" 
                required>
        </div>

        <button type="submit" class="btn-submit">
            <i class="bi bi-box-arrow-in-right"></i> Login Now
        </button>
    </form>

    <div class="divider">
        <span>Or</span>
    </div>

    <div class="auth-link">
        <p>Don't have an account? <a href="/signup">Sign up here</a></p>
    </div>

    <div class="auth-link" style="margin-top: 40px;">
        <a href="/">← Back to Home</a>
    </div>
</div>

{% endblock %}
